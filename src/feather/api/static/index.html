<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feather</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #11141b; --panel2: #161a23; --line: #232838;
    --ink: #e6e9f0; --dim: #8a93a6; --accent: #7cdcff; --accent2: #c9a6ff;
    --green: #79e0a8; --amber: #ffcf8a; --red: #ff8a8a; --magenta: #ff9ae0;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
    display: grid; grid-template-columns: 240px 1fr; height: 100vh;
  }
  /* sidebar */
  #sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 14px 16px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--line); }
  .section-label { padding: 12px 16px 6px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  #lead-list { list-style: none; margin: 0; padding: 0 8px; overflow-y: auto; flex: 1; }
  .lead {
    display: flex; align-items: center; gap: 8px; padding: 9px 10px; margin: 2px 0;
    border-radius: 8px; cursor: pointer; border: 1px solid transparent; color: var(--ink);
  }
  .lead:hover { background: var(--panel2); }
  .lead.active { background: var(--panel2); border-color: var(--accent); }
  .lead .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
  .lead.s-running .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .lead.s-awaiting_user .dot { background: var(--amber); }
  .lead .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lead .em { font-size: 15px; }
  .sidebar-actions { padding: 10px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  button {
    font: inherit; color: var(--ink); background: var(--panel2); border: 1px solid var(--line);
    padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: linear-gradient(180deg, #1b2233, #141a27); border-color: var(--accent); color: var(--accent); }
  /* main */
  #main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #topbar { display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #topbar .title { font-weight: 700; }
  #topbar .status { font-size: 12px; color: var(--dim); }
  #topbar .status .pill { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
  #topbar .spacer { flex: 1; }
  #stream { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); max-width: 860px; white-space: pre-wrap; word-break: break-word; }
  .msg .who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
  .msg.user { align-self: flex-end; background: #14202e; border-color: #284057; }
  .msg.user .who { color: var(--accent); }
  .msg.assistant .who { color: var(--green); }
  .msg.tool { background: var(--panel2); color: var(--dim); }
  .msg.tool .who { color: var(--accent2); }
  .msg.awaiting { border-color: var(--amber); }
  .msg.awaiting .who { color: var(--amber); }
  .msg.subagent .who { color: var(--magenta); }
  .msg.system { color: var(--dim); font-size: 12px; background: transparent; border-style: dashed; }
  .msg.error { border-color: var(--red); color: var(--red); }
  .streaming::after { content: "▍"; color: var(--green); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  /* composer */
  #composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  #composer textarea { flex: 1; resize: none; height: 44px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; font: inherit; }
  #composer textarea:focus { outline: none; border-color: var(--accent); }
  /* modal */
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; }
  .modal-back.open { display: flex; }
  .modal { width: min(720px, 92vw); max-height: 84vh; background: var(--panel); border: 1px solid var(--accent); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; }
  .modal h3 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .modal .body { padding: 14px 16px; overflow-y: auto; }
  .modal .row { display: flex; gap: 10px; }
  .modal input, .modal textarea { width: 100%; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font: inherit; }
  .sub-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
  .sub-item:hover { border-color: var(--accent); }
  .sub-item.active { border-color: var(--accent); background: var(--panel2); }
  .transcript .t-msg { border-bottom: 1px dashed var(--line); padding: 8px 0; white-space: pre-wrap; }
  .t-role { color: var(--accent); font-size: 11px; text-transform: uppercase; }
  .muted { color: var(--dim); }
</style>
</head>
<body>
  <aside id="sidebar">
    <div class="brand">✦ Feather</div>
    <div class="section-label">Leads</div>
    <ul id="lead-list" data-testid="lead-list"></ul>
    <div class="sidebar-actions">
      <button id="new-lead-btn" class="primary" data-testid="new-lead-btn">+ New lead</button>
    </div>
  </aside>

  <main id="main">
    <div id="topbar">
      <div class="title" id="active-lead-title" data-testid="active-lead-title">—</div>
      <div class="status">status <span class="pill" id="status-pill" data-testid="status-pill">idle</span></div>
      <div class="spacer"></div>
      <button id="subagents-btn" data-testid="subagents-btn">Sub-agents</button>
      <button id="config-btn" data-testid="config-btn">Config</button>
    </div>
    <div id="stream" data-testid="stream"></div>
    <form id="composer" data-testid="composer">
      <textarea id="input" data-testid="message-input" placeholder="Message the active lead…  (Enter to send)"></textarea>
      <button type="submit" class="primary" data-testid="send-btn">Send</button>
    </form>
  </main>

  <!-- New lead modal -->
  <div class="modal-back" id="new-lead-modal">
    <div class="modal">
      <h3>Create a lead</h3>
      <div class="body">
        <p class="muted">Name (letters, digits, - _ ), then pick a soul or write your own.</p>
        <div class="row" style="flex-direction:column;gap:10px">
          <input id="new-lead-name" data-testid="new-lead-name" placeholder="e.g. backend" />
          <select id="new-lead-soul-select" data-testid="new-lead-soul-select">
            <option value="">— Custom (write your own) —</option>
          </select>
          <div id="new-lead-soul-preview" data-testid="new-lead-soul-preview" class="muted" style="display:none;border-left:3px solid var(--accent);padding-left:10px;font-size:13px;line-height:1.5"></div>
          <textarea id="new-lead-soul" data-testid="new-lead-soul" rows="3" placeholder="You are Sophia, a meticulous researcher…"></textarea>
          <div class="row">
            <button id="new-lead-cancel" data-testid="new-lead-cancel">Cancel</button>
            <button id="new-lead-create" class="primary" data-testid="new-lead-create">Create</button>
          </div>
          <div id="new-lead-error" class="msg error" style="display:none" data-testid="new-lead-error"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sub-agent drill-down modal -->
  <div class="modal-back" id="subagents-modal">
    <div class="modal">
      <h3>Sub-agents <span class="muted" id="sub-lead-name"></span></h3>
      <div class="body">
        <div id="sub-list" data-testid="sub-list"></div>
        <div class="transcript" id="sub-transcript" data-testid="sub-transcript"></div>
        <div class="row" style="margin-top:10px"><button id="subagents-close" data-testid="subagents-close">Close</button></div>
      </div>
    </div>
  </div>

  <!-- Config modal -->
  <div class="modal-back" id="config-modal">
    <div class="modal">
      <h3>Configuration</h3>
      <div class="body"><pre id="config-body" data-testid="config-body" class="muted"></pre>
        <div class="row" style="margin-top:10px"><button id="config-close" data-testid="config-close">Close</button></div>
      </div>
    </div>
  </div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const api = (p, opts) => fetch(p, opts).then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(e)));
let state = { leads: [], active: null, ws: null, streamEl: null };

function statusClass(s){ return "s-" + (s||"idle"); }

async function loadLeads() {
  state.leads = await api("/api/leads");
  renderLeads();
  if (!state.active && state.leads.length) selectLead(state.leads[0].name);
}

function renderLeads() {
  const list = $("#lead-list");
  list.innerHTML = "";
  for (const lead of state.leads) {
    const li = document.createElement("li");
    li.className = "lead " + statusClass(lead.status) + (lead.name === state.active ? " active" : "");
    li.dataset.lead = lead.name;
    li.dataset.testid = "lead-" + lead.name;
    // Build via textContent (never innerHTML) — display_name/emoji come from
    // user- or YAML-supplied data and must not be interpreted as HTML.
    const dot = document.createElement("span"); dot.className = "dot";
    const em = document.createElement("span"); em.className = "em"; em.textContent = lead.emoji || "✦";
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = lead.display_name;
    li.append(dot, em, nm);
    li.onclick = () => selectLead(lead.name);
    list.appendChild(li);
  }
}

function setStatus(s){ $("#status-pill").textContent = s; const l = state.leads.find(x=>x.name===state.active); if(l){ l.status=s; renderLeads(); } }

async function selectLead(name) {
  state.active = name;
  const lead = state.leads.find(l => l.name === name);
  $("#active-lead-title").textContent = (lead?.emoji ? lead.emoji + " " : "") + (lead?.display_name || name);
  renderLeads();
  $("#stream").innerHTML = "";
  state.streamEl = null;
  await loadHistory(name);
  openSocket(name);
}

async function loadHistory(name) {
  try {
    const t = await api(`/api/leads/${name}/transcript`);
    for (const m of t.messages) {
      addMsg(m.role === "user" ? "user" : "assistant", m.role, m.content);
    }
  } catch (e) { /* new session */ }
}

function openSocket(name) {
  if (state.ws) { try { state.ws.close(); } catch(e){} state.ws = null; }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/api/leads/${name}/ws`);
  state.ws = ws;
  ws.onmessage = (ev) => { if (state.active === name) handleEvent(JSON.parse(ev.data)); };
}

function addMsg(cls, who, body) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.dataset.testid = "msg-" + cls;
  const w = document.createElement("div"); w.className = "who"; w.textContent = who;
  el.appendChild(w);
  const b = document.createElement("div"); b.className = "body"; b.textContent = body || "";
  el.appendChild(b);
  $("#stream").appendChild(el);
  $("#stream").scrollTop = $("#stream").scrollHeight;
  return el;
}

function handleEvent(ev) {
  switch (ev.kind) {
    case "assistant_text_delta": {
      if (!state.streamEl) { state.streamEl = addMsg("assistant streaming", "assistant", ""); }
      const b = $(".body", state.streamEl); b.textContent += ev.text || "";
      $("#stream").scrollTop = $("#stream").scrollHeight;
      break;
    }
    case "tool_started":
      finishStream();
      addMsg("tool", "tool · " + (ev.tool_name||""), (ev.text||"") || (ev.tool_name||""));
      break;
    case "tool_finished":
      finishStream();
      if (ev.tool_name !== "ask_user") addMsg("tool", "tool · " + (ev.tool_name||"") + " ✓", ev.text || "");
      break;
    case "awaiting_user":
      finishStream(); addMsg("awaiting", "awaiting you", ev.text || ""); break;
    case "agent_message_received":
      finishStream(); addMsg("subagent", "sub-agent", ev.text || ""); break;
    case "status":
      finishStream(); setStatus(ev.payload?.status || "idle"); break;
    case "error":
      finishStream(); addMsg("error", "error", ev.text || ""); break;
    case "connected": break;
    default:
      if (ev.kind?.startsWith("compaction_") || ev.kind?.startsWith("scheduled_task_"))
        addMsg("system", ev.kind, ev.text || "");
  }
}

function finishStream() {
  if (state.streamEl) { state.streamEl.classList.remove("streaming"); state.streamEl = null; }
}

async function sendMessage(text) {
  if (!text.trim() || !state.active) return;
  addMsg("user", "you", text);
  setStatus("running");
  if (state.ws && state.ws.readyState === 1) state.ws.send(JSON.stringify({ text }));
  else await api(`/api/leads/${state.active}/messages`, { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({text}) });
}

// composer
$("#composer").addEventListener("submit", (e) => { e.preventDefault(); const t=$("#input").value; $("#input").value=""; sendMessage(t); });
$("#input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("#composer").requestSubmit(); } });

// new lead
const nlModal = $("#new-lead-modal");
let souls = [];
async function loadSouls() {
  if (souls.length) return souls;
  try { souls = await api("/api/souls"); } catch { souls = []; }
  const sel = $("#new-lead-soul-select");
  for (const s of souls) {
    const o = document.createElement("option");
    o.value = s.id; o.textContent = `${s.emoji} ${s.title}`;
    sel.appendChild(o);
  }
  return souls;
}
function renderSoulPreview() {
  const id = $("#new-lead-soul-select").value;
  const soul = souls.find(s => s.id === id);
  const preview = $("#new-lead-soul-preview"), custom = $("#new-lead-soul");
  if (soul) {
    preview.style.display = "block";
    preview.textContent = soul.personality + (soul.tags && soul.tags.length ? `  ·  ${soul.tags.join(", ")}` : "");
    custom.style.display = "none";
  } else {
    preview.style.display = "none";
    custom.style.display = "block";
  }
}
$("#new-lead-soul-select").addEventListener("change", renderSoulPreview);
$("#new-lead-btn").onclick = async () => {
  $("#new-lead-error").style.display="none"; $("#new-lead-name").value=""; $("#new-lead-soul").value="";
  await loadSouls(); $("#new-lead-soul-select").value=""; renderSoulPreview();
  nlModal.classList.add("open");
};
$("#new-lead-cancel").onclick = () => nlModal.classList.remove("open");
$("#new-lead-create").onclick = async () => {
  try {
    const soulId = $("#new-lead-soul-select").value;
    const body = { name: $("#new-lead-name").value, soul: soulId ? "" : $("#new-lead-soul").value, soul_id: soulId || null };
    const lead = await api("/api/leads", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
    nlModal.classList.remove("open");
    await loadLeads(); selectLead(lead.name);
  } catch (e) { const el=$("#new-lead-error"); el.textContent = e.detail || "could not create lead"; el.style.display="block"; }
};

// sub-agents
const saModal = $("#subagents-modal");
$("#subagents-btn").onclick = async () => { saModal.classList.add("open"); await loadSubagents(); };
$("#subagents-close").onclick = () => saModal.classList.remove("open");
async function loadSubagents() {
  $("#sub-lead-name").textContent = "· " + state.active;
  const subs = await api(`/api/leads/${state.active}/subagents`);
  const list = $("#sub-list"); list.innerHTML = "";
  $("#sub-transcript").innerHTML = "";
  if (!subs.length) { list.innerHTML = '<div class="muted" data-testid="no-subagents">No live sub-agents.</div>'; return; }
  for (const s of subs) {
    const d = document.createElement("div"); d.className="sub-item"; d.dataset.testid="sub-"+s.session_id;
    d.textContent = `${s.agent_name} ${s.session_id.slice(0,8)} · ${s.task}`;
    d.onclick = async () => { document.querySelectorAll(".sub-item").forEach(x=>x.classList.remove("active")); d.classList.add("active"); await loadTranscript(s.session_id); };
    list.appendChild(d);
  }
}
async function loadTranscript(session_id) {
  const t = await api(`/api/sessions/${session_id}/transcript`);
  const box = $("#sub-transcript"); box.innerHTML = "";
  if (!t.messages.length) { box.innerHTML = '<div class="muted">No transcript yet.</div>'; return; }
  for (const m of t.messages) {
    const d = document.createElement("div"); d.className="t-msg";
    const role=document.createElement("div"); role.className="t-role"; role.textContent=m.role; d.appendChild(role);
    const b=document.createElement("div"); b.textContent=m.content; d.appendChild(b); box.appendChild(d);
  }
}

// config
const cfgModal = $("#config-modal");
$("#config-btn").onclick = async () => { const c = await api("/api/config"); $("#config-body").textContent = JSON.stringify(c.values, null, 2); cfgModal.classList.add("open"); };
$("#config-close").onclick = () => cfgModal.classList.remove("open");

// keyboard: ctrl+arrow switch leads
document.addEventListener("keydown", (e) => {
  if (!e.ctrlKey || (e.key !== "ArrowLeft" && e.key !== "ArrowRight")) return;
  const names = state.leads.map(l=>l.name); if (names.length<2) return;
  let i = names.indexOf(state.active); i = (i + (e.key==="ArrowRight"?1:-1) + names.length) % names.length;
  selectLead(names[i]);
});

loadLeads();
</script>
</body>
</html>
