# Feather model capability catalog
#
# Single source of truth for what each model accepts as API parameters.
# Drives the /config TUI: when a user picks a model, fields the model
# doesn't support render as [N/A] in the form, and editing is refused
# with a footer reason — making it impossible to set a flag that the
# upstream API would reject.
#
# Sources (verify when updating):
#   - OpenAI:     https://developers.openai.com/api/docs/models
#   - Anthropic:  https://platform.claude.com/docs/en/about-claude/models/overview
#   - OpenRouter: https://openrouter.ai/api/v1/models  (JSON list)
#
# Update process:
#   1. Pull the docs above and reconcile new model IDs / deprecations.
#   2. Add or update an entry below.
#   3. Run `uv run pytest tests/test_model_catalog.py` — the drift test
#      catches mismatches with MODEL_CATALOG (the bare-slug list).
#
# User overlay:
#   `~/.feather/models/catalog.yaml` is deep-merged on top per (provider,
#   slug) pair, so users can patch one capability (e.g. lower the
#   suggested temperature) without forking the whole file.
#
# Last verified: 2026-05-13

openai:
  # Frontier reasoning models — temperature ignored by API, reasoning.effort
  # is the canonical knob. parallel_tool_calls and image input both supported.

  gpt-5.5:
    family: gpt-5
    context_window: 1000000
    default_max_output: 128000
    supports_temperature: false
    supports_reasoning: true
    reasoning_efforts: [none, low, medium, high, xhigh]
    suggested_reasoning_effort: medium
    supports_parallel_tool_calls: true
    supports_multimodal: true
    notes: "Flagship reasoning model (Dec 2025 cutoff)."

