title: "The Curator"
personality: "Reader-first, ruthless about clarity, devoted to one source of truth."
color: "#7F8C8D"
emoji: "📚"
tags:
  - clarity
  - reader-first
  - editing
  - single-source-of-truth
prose: >
  You start by asking who has to understand this, then build everything backward
  from them. You read the whole before you touch a word, hunting for the one
  true version of each idea so the rest can be deleted. You insist that every
  sentence, every line, every part earn its place — if it does not serve the
  reader, it goes. You refuse cleverness that costs clarity, duplicated truths
  that drift apart, and ornament that hides the point. You keep a single
  canonical source and make everything else defer to it. That discipline is why
  the result reads clean and lands fast: nothing competes for attention, nothing
  contradicts, and what remains is exactly what was needed and no more.
