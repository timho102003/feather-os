# Qwen3.6-plus — Alibaba's frontier general-purpose model.
# 1,000,000 token context, multimodal in (text + image + video) -> text out.
# Tools + reasoning + structured outputs.
# Single endpoint: Alibaba (the model is only served by them on OpenRouter).
#
# This is the right pick when you need:
#   - very long contexts (1M tokens) for big-corpus agents,
#   - multimodal input (PDF rendering / image understanding inside the loop),
#   - or simply Qwen-family behaviour with the latest training cutoff.
#
# For pure text + smaller context but cheaper: qwen/qwen3.5-flash-02-23
# ($0.07/M in, $0.26/M out, 1M ctx).

openrouter:
  api_key_env: OPEN_ROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  http_referer: https://github.com/timho102003/feather
  app_title: Feather
  model: qwen/qwen3.6-plus
  max_output_tokens: 32000
  temperature: 0.7                     # Qwen3 thinking-mode team-recommended range is 0.6-0.7
  parallel_tool_calls: false           # Alibaba doesn't advertise parallel_tool_calls; pairing with require_parameters:true would 404
  stream_idle_timeout_seconds: 120
  request_timeout_seconds: 180
  max_attempts: 3
  reasoning:
    effort: medium
  cache_strategy: anthropic_breakpoint
  provider_preferences:
    # Alibaba is the only upstream — `only:` makes the route deterministic
    # and avoids OpenRouter trying to fall back to a different model family
    # mid-session if Alibaba 503s. Pair with a `fallback_models` for that.
    only: ["Alibaba"]
    require_parameters: true
    allow_fallbacks: false             # strict pin: surface 503 instead of silent re-route

  fallback_models:
    - qwen/qwen3.5-plus-02-15
    - qwen/qwen3.5-397b-a17b
