# Moonshot Kimi-K2.6 — flagship Chinese open-weight, agentic-tuned.
# 256K context, tools + reasoning + structured outputs.
# Served by Moonshot AI, DeepInfra, Parasail, Inceptron, Venice, Io Net.
# Cache reads ~5x cheaper than fresh prompt on every endpoint.
#
# Drop this block into config/app.yaml under `openrouter:` and set
# `active_provider: openrouter`.

openrouter:
  api_key_env: OPEN_ROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  http_referer: https://github.com/timho102003/feather
  app_title: Feather
  model: moonshotai/kimi-k2.6
  max_output_tokens: 32000
  temperature: 0.7                     # Kimi thinking-mode sweet spot
  # Most Kimi-K2.6 endpoints (Moonshot AI, DeepInfra, Parasail, Venice,
  # Io Net) do NOT advertise `parallel_tool_calls` in their
  # supported_parameters — Inceptron is the only one that does. Sending
  # `parallel_tool_calls: true` together with `require_parameters: true`
  # would 404 with "No endpoints found that can handle the requested
  # parameters". Leave this off (the default upstream behaviour still
  # allows the model to emit multiple tool_calls per turn; the merged
  # BaseAgent dispatches any it returns concurrently).
  parallel_tool_calls: false
  stream_idle_timeout_seconds: 90
  request_timeout_seconds: 180         # int4-quantized endpoints can be slow on big contexts
  max_attempts: 3
  reasoning:
    effort: medium                     # raise to "high" for planning-heavy lead turns
  cache_strategy: anthropic_breakpoint
  provider_preferences:
    require_parameters: true           # ensure tools + response_format honoured
    allow_fallbacks: true
    sort: throughput                   # swap to "price" if cost-bound
    # Single-provider pinning example (uncomment + remove `sort:` to use):
    # only: ["Moonshot AI"]
    # quantizations: ["int4"]
    # data_collection: deny            # enforce no-logging upstreams only

  # Catastrophic-failover models — used only if every Kimi endpoint is down.
  # Pick semantically similar reasoning-tuned alternates.
  fallback_models:
    - z-ai/glm-4.7
    - deepseek/deepseek-v3.2
